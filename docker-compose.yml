# Self-hosted setup: the app and its own MongoDB on one machine.
# With a hosted database (MongoDB Atlas), drop the mongo service and set MONGODB_URI in .env.
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build

services:
  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/suhayl}
    volumes:
      # Family uploads, when STORAGE_DRIVER=local
      - uploads:/app/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  mongo-data:
